name: Refresh MatchSignals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'matchsignal/**'
      - 'scripts/**'
      - 'templates/**'
      - 'app.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/refresh-predictions.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: matchsignal-scanner-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: refresh
        continue-on-error: true
        run: timeout 10m python scripts/refresh_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matchsignal-snapshot-${{ github.run_id }}
          path: |
            data/signals.json
            VALIDATION_REPORT.md
          retention-days: 30
      - run: |
          git config user.name "MatchSignal updater"
          git config user.email "actions@github.com"
          git add index.html data/signals.json VALIDATION_REPORT.md
          git diff --staged --quiet || git commit -m "Refresh MatchSignals"
          git push
      - name: Report degraded refresh after preserving diagnostics
        run: test "${{ steps.refresh.outcome }}" = "success"
