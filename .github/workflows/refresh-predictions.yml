name: Refresh football predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_v2.py
      - run: python scripts/build_snapshot_v2.py
      - run: rm -rf data
      - run: |
          git config user.name "MatchSignal updater"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Refresh football predictions"
          git push
