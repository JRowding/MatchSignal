name: Refresh football predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_football_database.py
      - run: python scripts/match_live_fixtures.py
      - run: python scripts/build_head_to_head_predictions.py
      - run: python scripts/render_prediction_page.py
      - run: rm -f scripts/football_data.sqlite scripts/football_data.sqlite-wal scripts/football_data.sqlite-shm
      - run: |
          git config user.name "MatchSignal updater"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Refresh football predictions"
          git push
