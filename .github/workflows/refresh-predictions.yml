name: Refresh football predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "matchsignal/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refresh-predictions.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: matchsignal-prediction-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: timeout 15m python scripts/refresh_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-ledger-${{ github.run_id }}
          path: data/matchsignal.sqlite
          retention-days: 90
      - run: python scripts/build_snapshot_v2.py
      - run: |
          git config user.name "MatchSignal updater"
          git config user.email "actions@github.com"
          git add index.html
          git add -f data/matchsignal.sqlite
          git diff --staged --quiet || git commit -m "Refresh football predictions"
          git push
